{{ $post := . }}
<article class="post-card">
  {{ with .Params.cover }}
  <a href="{{ $post.RelPermalink }}" aria-label="{{ $post.Title }}">
    <img src="{{ . | relURL }}" alt="{{ $post.Params.coverAlt | default "" }}" width="320" height="180" loading="lazy">
  </a>
  {{ end }}
  <div class="post-card-body">
    <p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
    <a class="text-link" href="{{ .RelPermalink }}">Read guide</a>
  </div>
</article>
